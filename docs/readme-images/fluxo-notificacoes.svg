<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc"><title id="title">Fluxo de notificações</title><desc id="desc">Processamento assíncrono: a requisição HTTP não envia push diretamente.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="635" rx="20" fill="#fff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="53" font-size="30" fill="#0f172a" font-weight="700">Fluxo de notificações</text><text x="40" y="85" font-size="17" fill="#475569" font-weight="400">Processamento assíncrono: a requisição HTTP não envia push diretamente.</text><rect x="40" y="135" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="170" font-size="22" fill="#0f172a" font-weight="600">1 · Ação na General API</text><text x="62" y="200" font-size="17" fill="#475569" font-weight="400">Atribuição, prazo ou movimento</text><text x="62" y="225" font-size="17" fill="#475569" font-weight="400">Validação das permissões</text><rect x="440" y="135" width="320" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="462" y="170" font-size="22" fill="#0f172a" font-weight="600">2 · Persistência</text><text x="462" y="200" font-size="17" fill="#475569" font-weight="400">notification_jobs e outbox</text><text x="462" y="225" font-size="17" fill="#475569" font-weight="400">Eventos RabbitMQ opcionais</text><rect x="840" y="135" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="862" y="170" font-size="22" fill="#0f172a" font-weight="600">3 · Worker consulta</text><text x="862" y="200" font-size="17" fill="#475569" font-weight="400">Polling ou gatilho da fila</text><text x="862" y="225" font-size="17" fill="#475569" font-weight="400">Claim de jobs vencidos</text><polyline points="360,197 440,197" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="760,197 840,197" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1000,260 1000,360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="840" y="360" width="320" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="862" y="395" font-size="22" fill="#0f172a" font-weight="600">4 · Controles</text><text x="862" y="425" font-size="17" fill="#475569" font-weight="400">Redis: lock e idempotência</text><text x="862" y="450" font-size="17" fill="#475569" font-weight="400">Tarefa, janela e throttle</text><rect x="440" y="360" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="462" y="395" font-size="22" fill="#0f172a" font-weight="600">5 · Dispositivos e envio</text><text x="462" y="425" font-size="17" fill="#475569" font-weight="400">Dispositivos ativos elegíveis</text><text x="462" y="450" font-size="17" fill="#475569" font-weight="400">noop ou FCM legado</text><rect x="40" y="360" width="320" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="62" y="395" font-size="22" fill="#0f172a" font-weight="600">6 · Registro do resultado</text><text x="62" y="425" font-size="17" fill="#475569" font-weight="400">Entregas por dispositivo</text><text x="62" y="450" font-size="17" fill="#475569" font-weight="400">SENT, SKIPPED, retry ou FAILED</text><polyline points="840,422 760,422" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="440,422 360,422" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="540" font-size="18" fill="#475569" font-weight="400">Condições podem ignorar ou reagendar o job antes do envio.</text><text x="40" y="575" font-size="18" fill="#475569" font-weight="400">noop registra uma entrega simulada; não entrega uma notificação real ao celular.</text><text x="40" y="610" font-size="15" fill="#64748b" font-weight="400">ODIN · Diagrama baseado no código presente no repositório</text></g></svg>