<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Arquitetura de produtividade e notificações</title><desc id="desc">O cliente desenhado é uma ideação; as APIs e a infraestrutura têm código presente.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="670" rx="20" fill="#fff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="53" font-size="30" fill="#0f172a" font-weight="700">Arquitetura de produtividade e notificações</text><text x="40" y="85" font-size="17" fill="#475569" font-weight="400">O cliente desenhado é uma ideação; as APIs e a infraestrutura têm código presente.</text><rect x="40" y="135" width="320" height="125" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="62" y="170" font-size="22" fill="#0f172a" font-weight="600">Cliente conceitual</text><text x="62" y="200" font-size="17" fill="#475569" font-weight="400">HTTP com JWT</text><text x="62" y="225" font-size="17" fill="#475569" font-weight="400">Eventos WebSocket/STOMP</text><rect x="440" y="135" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="462" y="170" font-size="22" fill="#0f172a" font-weight="600">General API</text><text x="462" y="200" font-size="17" fill="#475569" font-weight="400">Regras, tarefas e permissões</text><text x="462" y="225" font-size="17" fill="#475569" font-weight="400">Jobs e outbox · porta 8080</text><rect x="840" y="135" width="320" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="862" y="170" font-size="22" fill="#0f172a" font-weight="600">PostgreSQL</text><text x="862" y="200" font-size="17" fill="#475569" font-weight="400">Dados de domínio e jobs</text><text x="862" y="225" font-size="17" fill="#475569" font-weight="400">Registro das entregas</text><polyline points="360,180 440,180" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="375" y="167" font-size="16" fill="#475569" font-weight="400">HTTP</text><polyline points="440,225 360,225" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="371" y="251" font-size="16" fill="#475569" font-weight="400">STOMP</text><polyline points="760,195 840,195" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="385" width="320" height="125" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="62" y="420" font-size="22" fill="#0f172a" font-weight="600">RabbitMQ · opcional</text><text x="62" y="450" font-size="17" fill="#475569" font-weight="400">Eventos notification.#</text><text x="62" y="475" font-size="17" fill="#475569" font-weight="400">Gatilho para consulta ao banco</text><rect x="440" y="385" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="462" y="420" font-size="22" fill="#0f172a" font-weight="600">Service API</text><text x="462" y="450" font-size="17" fill="#475569" font-weight="400">Polling e processamento</text><text x="462" y="475" font-size="17" fill="#475569" font-weight="400">Worker · porta 8081</text><rect x="840" y="385" width="320" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="862" y="420" font-size="22" fill="#0f172a" font-weight="600">Redis</text><text x="862" y="450" font-size="17" fill="#475569" font-weight="400">Locks e idempotência</text><text x="862" y="475" font-size="17" fill="#475569" font-weight="400">Throttle por usuário</text><polyline points="510,260 510,315 200,315 200,385" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="228" y="305" font-size="16" fill="#475569" font-weight="400">Publicação</text><polyline points="360,447 440,447" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><polyline points="600,385 600,300 1000,300 1000,260" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="647" y="289" font-size="16" fill="#475569" font-weight="400">Consulta e atualização dos jobs</text><polyline points="760,447 840,447" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="565" font-size="18" fill="#0f766e" font-weight="400">Saída do worker: noop (simulação) ou FCM legado</text><text x="40" y="610" font-size="18" fill="#475569" font-weight="400">O protótipo de voz tem backend próprio e não está integrado a essas APIs.</text><text x="40" y="645" font-size="15" fill="#64748b" font-weight="400">ODIN · Diagrama baseado no código presente no repositório</text></g></svg>