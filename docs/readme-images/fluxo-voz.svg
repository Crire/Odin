<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-labelledby="title desc"><title id="title">Fluxo da conversa por voz</title><desc id="desc">Android → transcrição → geração de resposta → fala no dispositivo.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="635" rx="20" fill="#fff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="53" font-size="30" fill="#0f172a" font-weight="700">Fluxo da conversa por voz</text><text x="40" y="85" font-size="17" fill="#475569" font-weight="400">Android → transcrição → geração de resposta → fala no dispositivo.</text><rect x="40" y="135" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="170" font-size="22" fill="#0f172a" font-weight="600">1 · Android captura</text><text x="62" y="200" font-size="17" fill="#475569" font-weight="400">Falar → PCM 16-bit mono</text><text x="62" y="225" font-size="17" fill="#475569" font-weight="400">16 kHz · chunks binários</text><rect x="440" y="135" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="462" y="170" font-size="22" fill="#0f172a" font-weight="600">2 · Backend Go</text><text x="462" y="200" font-size="17" fill="#475569" font-weight="400">WebSocket /voice</text><text x="462" y="225" font-size="17" fill="#475569" font-weight="400">Encaminha o áudio recebido</text><rect x="840" y="135" width="320" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="862" y="170" font-size="22" fill="#0f172a" font-weight="600">3 · Deepgram</text><text x="862" y="200" font-size="17" fill="#475569" font-weight="400">STT por streaming</text><text x="862" y="225" font-size="17" fill="#475569" font-weight="400">Devolve a transcrição</text><polyline points="360,197 440,197" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="760,197 840,197" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1000,260 1000,360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1008" y="317" font-size="16" fill="#475569" font-weight="400">Via backend</text><rect x="840" y="360" width="320" height="125" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="862" y="395" font-size="22" fill="#0f172a" font-weight="600">4 · Go chama Gemini</text><text x="862" y="425" font-size="17" fill="#475569" font-weight="400">Texto + contexto da sessão</text><text x="862" y="450" font-size="17" fill="#475569" font-weight="400">Geração da resposta</text><rect x="440" y="360" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="462" y="395" font-size="22" fill="#0f172a" font-weight="600">5 · Backend responde</text><text x="462" y="425" font-size="17" fill="#475569" font-weight="400">transcript</text><text x="462" y="450" font-size="17" fill="#475569" font-weight="400">assistant_response</text><rect x="40" y="360" width="320" height="125" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="62" y="395" font-size="22" fill="#0f172a" font-weight="600">6 · Android fala</text><text x="62" y="425" font-size="17" fill="#475569" font-weight="400">Exibe texto na conversa</text><text x="62" y="450" font-size="17" fill="#475569" font-weight="400">TextToSpeech nativo</text><polyline points="840,422 760,422" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="440,422 360,422" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="540" font-size="18" fill="#475569" font-weight="400">Parar envia end_utterance; o backend solicita a finalização da fala ao STT.</text><text x="40" y="575" font-size="18" fill="#475569" font-weight="400">As chaves ficam no backend. Este fluxo não cria tarefas na General API.</text><text x="40" y="610" font-size="15" fill="#64748b" font-weight="400">ODIN · Diagrama baseado no código presente no repositório</text></g></svg>